[package]
name = "inkstone-workspace"
version = "0.1.0"
edition = "2021"

[dependencies]
inkstone-core = { path = "../inkstone-core" }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
toml = "0.8"
thiserror = "1"
async-trait = "0.1"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
