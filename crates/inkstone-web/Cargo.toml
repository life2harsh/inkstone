[package]
name = "inkstone-web"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
serverless-local = []

[dependencies]
inkstone-client = { path = "../inkstone-client" }
inkstone-core = { path = "../inkstone-core" }
inkstone-workspace = { path = "../inkstone-workspace" }
stonepen-wasm = { path = "../../stonepen/crates/stonepen-wasm" }
stonepen-core = { path = "../../stonepen/crates/stonepen-core" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = { version = "0.2", features = ["js"] }
uuid = { version = "1", features = ["v4", "serde", "js"] }
console_error_panic_hook = "0.1"
futures-channel = "0.3"
async-trait = "0.1"
comrak = "0.29"
regex = "1"
argon2 = "0.5"
async-lock = "3"
base64 = "0.22"
chacha20poly1305 = "0.10"
sha2 = "0.10"
hkdf = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Document",
    "Element",
    "FocusOptions",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "Event",
    "EventTarget",
    "MouseEvent",
    "InputEvent",
    "FocusEvent",
    "Storage",
    "IdbFactory",
    "IdbOpenDbRequest",
    "IdbDatabase",
    "IdbTransaction",
    "IdbObjectStore",
    "IdbRequest",
    "IdbTransactionMode",
    "KeyboardEvent",
    "DomException",
    "console",
    "IdbVersionChangeEvent",
    "DomStringList",
    "HtmlAnchorElement",
    "HtmlIFrameElement",
    "HtmlSelectElement",
    "Blob",
    "BlobPropertyBag",
    "File",
    "FileList",
    "Url",
    "Text",
    "NodeList",
    "Request",
    "RequestCredentials",
    "RequestInit",
    "Response",
    "Headers",
    "WebSocket",
    "MessageEvent",
    "ErrorEvent",
    "CloseEvent",
    "Location",
    "History",
    "PointerEvent",
    "DomRect",
    "CssStyleDeclaration",
    "AddEventListenerOptions",
    "EventListenerOptions",
    "HtmlCanvasElement",
    "HtmlImageElement",
    "CanvasRenderingContext2d",
    "ResizeObserver",
    "HtmlCollection",
    "Range",
    "ScrollIntoViewOptions",
    "ScrollLogicalPosition",
    "RtcPeerConnection",
    "RtcConfiguration",
    "RtcIceServer",
    "RtcDataChannel",
    "RtcDataChannelInit",
    "RtcDataChannelEvent",
    "RtcDataChannelState",
    "RtcPeerConnectionIceEvent",
    "RtcIceCandidate",
    "RtcIceCandidateInit",
    "RtcSessionDescription",
    "RtcSessionDescriptionInit",
    "RtcSdpType",
    "RtcPeerConnectionState",
    "PointerEventInit",
    "ClipboardEvent",
    "DataTransfer",
    "DragEvent",
    "DomRectList",
    "Node",
]

[package.metadata.wasm-pack.profile.profiling]
wasm-opt = ["-O", "-g"]
