[package]
name = "inkstone-web"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
inkstone-client = { path = "../inkstone-client" }
inkstone-core = { path = "../inkstone-core" }
inkstone-workspace = { path = "../inkstone-workspace" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = { version = "0.2", features = ["js"] }
uuid = { version = "1", features = ["v4", "serde", "js"] }
console_error_panic_hook = "0.1"
futures-channel = "0.3"
async-trait = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "Event",
    "EventTarget",
    "MouseEvent",
    "InputEvent",
    "FocusEvent",
    "Storage",
    "IdbFactory",
    "IdbOpenDbRequest",
    "IdbDatabase",
    "IdbTransaction",
    "IdbObjectStore",
    "IdbRequest",
    "IdbTransactionMode",
    "KeyboardEvent",
    "DomException",
    "console",
    "IdbVersionChangeEvent",
    "DomStringList",
]
