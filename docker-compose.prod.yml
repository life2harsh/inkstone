name: inkstone

services:
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the env file}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the env file}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/run/postgresql

  server:
    image: inkstone-server:arm64
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the env file}
      HOST: 0.0.0.0
      PORT: "8080"
      DEV_AUTH: ${DEV_AUTH:?Set DEV_AUTH in the env file}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS in the env file}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in the env file}
      COOKIE_SECURE: ${COOKIE_SECURE:?Set COOKIE_SECURE in the env file}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:?Set SESSION_TTL_HOURS in the env file}
      LOG_LEVEL: ${LOG_LEVEL:?Set LOG_LEVEL in the env file}
      RUST_LOG: ${LOG_LEVEL:?Set LOG_LEVEL in the env file}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      EMAIL_OPTIONAL: ${EMAIL_OPTIONAL:-false}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  caddy-permissions:
    image: alpine:3.22.1
    command: ["chown", "-R", "10001:10001", "/data", "/config"]
    user: "0:0"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true

  web:
    image: inkstone-web:arm64
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in the env file}
    ports:
      - "127.0.0.1:18081:80"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy
      caddy-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  caddy_data:
  caddy_config:
